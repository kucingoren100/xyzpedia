name: XYZPEDIA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npx vitest run
        env:
          ADMIN_JWT_SECRET: "ci-test-secret-key-xyzpedia-for-testing-purpose-only"
          SETTINGS_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          SYSTEM_NOTIFICATION_AES_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      - name: Next.js Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          ADMIN_JWT_SECRET: "ci-test-secret-key-xyzpedia-for-testing-purpose-only"
          SETTINGS_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          SYSTEM_NOTIFICATION_AES_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXT_PUBLIC_SITE_URL: "https://xyzpedia.test"

      - name: Security Audit (High/Critical)
        run: npm audit --audit-level=high || true
